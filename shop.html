<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daft Punk Merch Store</title>

    <link rel="stylesheet" href="shop.css">
</head>

<body>

    <header>
        <h1>Daft Punk Merch Store</h1>

        <div class="search-box">
            <input type="text" placeholder="¿Qué buscas hoy?">
        </div>
    </header>

    <section class="categories">
        <button>Vinilos</button>
        <button>Casets</button>
        <button>Cascos</button>
        <button>Camisetas</button>
        <button>Chaquetas</button>
        <button>Hoodies</button>
        <button>CD's</button>
    </section>

<section class="products">

    <div class="card" onclick="openProduct('Alive','/Proyecto-Pagina/alive.jpeg','$24 USD','Álbum Alive de Daft Punk')">
        <img src="/Proyecto-Pagina/alive.jpeg" alt="Alive">
    </div>

    <div class="card" onclick="openProduct('Around The World','/Proyecto-Pagina/around_the_world.jpeg','$22 USD','Single Around The World')">
        <img src="/Proyecto-Pagina/around_the_world.jpeg" alt="Around The World">
    </div>

    <div class="card" onclick="openProduct('Human After All','/Proyecto-Pagina/human_after_all.jpeg','$25 USD','Álbum Human After All')">
        <img src="/Proyecto-Pagina/human_after_all.jpeg" alt="Human After All">
    </div>

    <div class="card" onclick="openProduct('Burnin','/Proyecto-Pagina/burnin.jpeg','$20 USD','Single Burnin')">
        <img src="/Proyecto-Pagina/burnin.jpeg" alt="Burnin">
    </div>

    <div class="card" onclick="openProduct('Random Access Memories','/Proyecto-Pagina/random_access_memories.jpeg','$30 USD','Álbum Random Access Memories')">
        <img src="/Proyecto-Pagina/random_access_memories.jpeg" alt="Random Access Memories">
    </div>

    <div class="card" onclick="openProduct('Da Funk','/Proyecto-Pagina/da_funk.jpeg','$20 USD','Single Da Funk')">
        <img src="/Proyecto-Pagina/da_funk.jpeg" alt="Da Funk">
    </div>

    <div class="card" onclick="openProduct('Something About Us','/Proyecto-Pagina/something_about_us.jpeg','$22 USD','Single Something About Us')">
        <img src="/Proyecto-Pagina/something_about_us.jpeg" alt="Something About Us">
    </div>

    <div class="card" onclick="openProduct('Discovery','/Proyecto-Pagina/discovery.jpeg','$28 USD','Álbum Discovery')">
        <img src="/Proyecto-Pagina/discovery.jpeg" alt="Discovery">
    </div>

</section>

    <div id="modal" class="modal">

        <span class="close" onclick="closeProduct()">&times;</span>

        <div class="modal-content">

            <img id="modalImg">

            <div class="info">
                <h2 id="modalTitle"></h2>
                <p id="modalDesc"></p>
                <h3 id="modalPrice"></h3>
                <button>Comprar Ahora</button>
            </div>

        </div>

    </div>

    <script src="shop.js"></script>

</body>

</html>
